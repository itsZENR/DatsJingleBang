name: Import hackathon archive

on:
  push:
    branches: [archive-upload]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/archive-upload'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify, restore source history and publish archive assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/archive_import.py
